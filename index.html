<style>
  :root {
    color-scheme: dark;
    --ink: #e9ecea;
    --muted: #8f9a96;
    --faint: #5c6662;
    --line-green: #3aa36a;   /* 松山新店線 綠 */
    --line-orange: #f0a232;  /* 中和新蘆線 橙 */
    --black: #000;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* 手機點擊時不要出現瀏覽器預設的藍色反白 */
  * { -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--black);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  /* ---------- 首頁 ---------- */
  #title-screen, .title-clone {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 24px 16px calc(15vh + env(safe-area-inset-bottom, 0px));
    background:
      url("https://images.plurk.com/354QmmqGvNUZIJ072J9KoI.png") center / cover no-repeat,
      #0b0e0d;
  }
  /* 首頁最下方的作者與版本 */
  .credit { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0;
    text-align: center; font-size: .75rem; letter-spacing: .12em; color: rgba(255,255,255,.45); pointer-events: none; }
  .title-inner {
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    max-width: 640px;
    animation: rise 1.6s ease-out both;
  }
  .lines {
    display: flex; gap: 6px;
  }
  .lines span { width: 44px; height: 4px; border-radius: 2px; }
  .lines .g { background: var(--line-green); }
  .lines .o { background: var(--line-orange); }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(2.2rem, 7vw, 4.2rem);
    letter-spacing: .12em;
    line-height: 1.25;
    text-wrap: balance;
    text-shadow: 0 0 4px rgba(0,0,0,.9), 0 2px 18px rgba(0,0,0,.85);
  }
  h1 .comma { color: #fff; }
  .intro {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(.95rem, 2.4vw, 1.1rem);
    line-height: 2;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 1px 10px rgba(0,0,0,.95);
  }
  .intro.broken { white-space: pre-line; }
  .intro .note { display: block; font-size: .85em; color: #fff; letter-spacing: .08em; }
  .menu { display: flex; gap: 2.4em; margin-top: 8px; }
  .link {
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    font-family: var(--serif); font-size: 1.1rem; letter-spacing: .2em;
    color: var(--ink);
    text-shadow: 0 0 3px #000, 0 1px 10px rgba(0,0,0,.95);
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .link:hover, .link:focus-visible { color: #fff; border-bottom-color: var(--line-green); outline: none; }
  .link::before { content: "▸ "; opacity: 0; transition: opacity .2s; color: var(--line-green); }
  .link:hover::before, .link:focus-visible::before { opacity: 1; }

  /* 首頁選單：滑鼠移過時以綠色【】框住文字 */
  .menu .link { position: relative; white-space: nowrap; }
  .menu .link.run { color: #e0453a; }
  .menu { flex-wrap: wrap; justify-content: center; }
  @media (max-width: 480px) {
    .menu { gap: .9em; }
    .menu .link { font-size: .9rem; letter-spacing: .05em; }
  }
  .menu .link:hover, .menu .link:focus-visible { border-bottom-color: transparent; }
  .menu .link::before, .menu .link::after {
    position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--line-green); letter-spacing: 0;
    opacity: 0; transition: opacity .2s;
  }
  .menu .link::before { content: "【"; right: 100%; }
  .menu .link::after  { content: "】"; left: calc(100% - .2em); }
  .menu .link:hover::before, .menu .link:hover::after,
  .menu .link:focus-visible::before, .menu .link:focus-visible::after { opacity: 1; }

  /* 首頁下方的小連結（其他作品／贊助我們） */
  .extra-links { display: flex; gap: 2em; margin-top: -4px; }
  .extra-links a {
    font-family: var(--serif); font-size: .85rem; letter-spacing: .15em; color: #cfd6d3; text-decoration: none;
    text-shadow: 0 0 3px #000, 0 1px 8px rgba(0,0,0,.95);
    border-bottom: 1px solid transparent; transition: color .2s, border-color .2s;
  }
  .extra-links a:hover, .extra-links a:focus-visible { color: #fff; border-bottom-color: var(--line-green); outline: none; }

  /* 解鎖通知 */
  #toasts { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 90;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { padding: 8px 20px; background: rgba(0,0,0,.85); border: 1px solid var(--line-green); color: var(--line-green);
    font-family: var(--serif); font-weight: 700; font-size: 1rem; letter-spacing: .12em; white-space: nowrap;
    box-shadow: 0 0 16px rgba(58,163,106,.25); animation: toastin .35s ease-out both; transition: opacity .5s, transform .5s; }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  @keyframes toastin { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

  /* 來電彈窗 */
  .call-mask { position: fixed; inset: 0; z-index: 75; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.35); animation: fadein .2s ease-out both; }
  .call-box { min-width: min(300px, 100%); padding: 24px 32px 26px; background: #000; border: 1px solid #555; text-align: center; color: #fff;
    font-family: var(--sans); box-shadow: 0 0 24px rgba(0,0,0,.8); }
  .call-status { font-size: .85rem; letter-spacing: .15em; color: #aaa; }
  .call-name { margin: 10px 0 20px; font-size: 1.4rem; font-weight: 700; letter-spacing: .1em; }
  .call-actions { display: flex; justify-content: center; gap: 18px; }
  .call-btn { padding: 8px 26px; border: 0; border-radius: 0; color: #fff; font: 700 1rem var(--sans); letter-spacing: .1em; cursor: pointer; }
  .call-mask.in-call .call-actions { display: none; }
  .call-mask.in-call .call-name { margin-bottom: 0; }
  .call-after { display: none; }
  .call-mask.after .call-status, .call-mask.after .call-name, .call-mask.after .call-actions { display: none; }
  .call-mask.after .call-after { display: block; }
  .call-after p { margin: 0 0 18px; line-height: 1.9; letter-spacing: .08em; }
  .call-dl { padding: 4px 8px; border: 0; background: none; color: #fff; font: 700 1rem var(--sans); letter-spacing: .1em; cursor: pointer; }
  .call-dl:hover, .call-dl:focus-visible { color: #ffd76a; outline: none; }
  .call-btn.answer { background: #2fa552; }
  .call-btn.hang { background: #d23b30; }
  .call-btn:hover, .call-btn:focus-visible { filter: brightness(1.15); outline: none; }

  /* 隧道逃生小遊戲 */
  .tunnel-win { position: fixed; inset: 0; z-index: 85; background: #020403; }
  .tunnel-win iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* ---------- 劇情頁 ---------- */
  #story-screen { transition: background-color 1.2s ease; }
  #story-screen.blood { background: #3a0707; }
  /* 下墜：往上飛的速度線 */
  #story-screen.fall::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      linear-gradient(transparent 55%, rgba(255,255,255,0.5) 88%, transparent) 4% 0 / 1px 300px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.3) 88%, transparent) 11% 0 / 2px 200px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.55) 88%, transparent) 17% 0 / 1px 600px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.3) 88%, transparent) 24% 0 / 1px 150px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.4) 88%, transparent) 30% 0 / 2px 300px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.5) 88%, transparent) 37% 0 / 1px 200px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.35) 88%, transparent) 43% 0 / 1px 600px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.3) 88%, transparent) 50% 0 / 2px 150px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.55) 88%, transparent) 56% 0 / 1px 300px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.35) 88%, transparent) 63% 0 / 1px 200px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.45) 88%, transparent) 69% 0 / 2px 600px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.3) 88%, transparent) 76% 0 / 1px 150px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.5) 88%, transparent) 82% 0 / 1px 300px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.35) 88%, transparent) 88% 0 / 2px 200px repeat-y,
      linear-gradient(transparent 55%, rgba(255,255,255,0.5) 88%, transparent) 95% 0 / 1px 600px repeat-y;
    animation: fallspeed .45s linear infinite;
  }
  @keyframes fallspeed {
    to { background-position: 4% -600px, 11% -600px, 17% -600px, 24% -600px, 30% -600px, 37% -600px, 43% -600px, 50% -600px, 56% -600px, 63% -600px, 69% -600px, 76% -600px, 82% -600px, 88% -600px, 95% -600px; }
  }
  @media (prefers-reduced-motion: reduce) { #story-screen.fall::before { animation-duration: 3s; } }
  /* 夢醒：白色背景、淺棕色文字 */
  #story-screen.dream { background: #fff; }
  #story-screen.dream .stage p, #story-screen.dream .stage p.old { color: #a8835e; }
  #story-screen.dream .stage p.end.dream { color: #8a6440; }
  #story-screen.dream .choice, #story-screen.dream .link, #story-screen.dream .hint { color: #a8835e; text-shadow: none; }
  #story-screen.dream .choice:hover, #story-screen.dream .choice:focus-visible { color: #6e4c2c; }
  #story-screen.dream .caret { background: #a8835e; }
  /* 不醒來：全白畫面，只剩文字 */
  #story-screen.white { background: #fff; }
  #story-screen.white .stage p, #story-screen.white .stage p.old { color: #a8835e; }
  #story-screen.white .choice { color: #a8835e; }
  #story-screen.white .choice:hover, #story-screen.white .choice:focus-visible { color: #6e4c2c; }
  #story-screen.white .caret { background: #a8835e; }
  #story-screen .stage p.reload-hint, #story-screen .stage p.reload-hint.old { margin-top: 2.2em; font-size: .8rem; letter-spacing: .12em; color: #c9b39b; }
  #story-screen.white .story-actions, #story-screen.white .story-left, #story-screen.white .hint { visibility: hidden; }
  #story-screen, #endings-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    padding: 16px;
    background: var(--black);
  }
  .stage-wrap {
    width: 800px; height: 600px;
    max-width: 100%;
    max-height: calc(100% - 110px);
    position: relative;
  }
  .stage {
    width: 100%; height: 100%;
    padding: 48px 64px;
    overflow-y: auto;
    cursor: pointer;
    user-select: none;
  }
  .stage p {
    margin: 0 0 .6em;
    font-family: var(--serif);
    font-size: 1.12rem;
    line-height: 1.6;
    color: var(--ink);
    max-width: 38em;
  }
  /* 細綠色捲軸 */
  .stage { scrollbar-width: thin; scrollbar-color: var(--line-green) transparent; }
  .stage::-webkit-scrollbar { width: 4px; }
  .stage::-webkit-scrollbar-track { background: transparent; }
  .stage::-webkit-scrollbar-thumb { background: var(--line-green); border-radius: 2px; }
  .stage::-webkit-scrollbar-thumb:hover { background: #4fc283; }
  .stage p.old { color: #b9c0bd; }
  .stage p.glow { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.7), 0 0 20px rgba(200,230,255,.55), 0 0 38px rgba(170,215,255,.4); }
  .stage p.glow.old { color: #eef4f2; }
  .stage p.gap { margin-top: 1.4em; }
  .stage p.bold { font-weight: 700; color: #fff; }
  .stage p.shout, .stage p.shout.old { font-weight: 700; font-size: 1.5rem; color: #fff; letter-spacing: .04em; }
  .stage p.shout.red, .stage p.shout.red.old { color: #d8423a; }
  .stage p.redbold, .stage p.redbold.old { font-weight: 700; color: #d8423a; }
  .stage p.mirror { transform: scaleX(-1); }
  .stage p.end.good, .stage p.end.good.old { color: var(--line-green); }
  /* 電梯門：從兩側關上，文字跟著被擠壓 */
  .stage-wrap { --door: 0; }
  .stage { transition: padding .9s ease; }
  .stage-wrap.doors .stage { padding-left: max(64px, calc(var(--door) * 100% + 20px)); padding-right: max(64px, calc(var(--door) * 100% + 20px)); }
  .door {
    position: absolute; top: 0; bottom: 0; width: calc(var(--door) * 100%); z-index: 2; pointer-events: none;
    background:
      linear-gradient(to right, rgba(255,255,255,.06), rgba(255,255,255,0) 30%, rgba(0,0,0,.25)),
      repeating-linear-gradient(to bottom, #2a2f2e 0 2px, #252a29 2px 4px);
    transition: width .9s ease;
  }
  .door.l { left: 0; border-right: 2px solid #5c6662; box-shadow: 6px 0 14px rgba(0,0,0,.6); }
  .door.r { right: 0; border-left: 2px solid #5c6662; box-shadow: -6px 0 14px rgba(0,0,0,.6); }
  .stage-wrap:not(.doors) .door { display: none; }
  /* 手電筒：只有游標周圍看得見 */
  .torch {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; display: none;
    background: radial-gradient(circle 150px at var(--fx, 50%) var(--fy, 50%),
      rgba(0,0,0,0) 0, rgba(0,0,0,0) 55%, rgba(0,0,0,.85) 80%, #000 100%);
  }
  .stage-wrap.flashlight .torch { display: block; }
  .stage-wrap.flashlight, .stage-wrap.flashlight .stage { touch-action: none; }
  @media (prefers-reduced-motion: reduce) { .stage, .door { transition: none; } }
  .stage p.end.normal, .stage p.end.normal.old { color: #fff; }
  .stage p.chant { word-break: break-all; }
  .stage .blur { filter: blur(3px); }
  .stage .copy-code { cursor: pointer; color: var(--line-green); text-decoration: underline dotted; text-underline-offset: 3px; word-break: break-all; }
  .stage .copy-code:hover { color: #5fd08f; }
  .scene-video { margin: .4em 0 1.4em; width: 100%; animation: fadein .6s ease-out both; }
  .scene-video { position: relative; }
  .video-shield { position: absolute; inset: 0; z-index: 1; }
  .scene-video video { display: block; width: 100%; height: auto; background: #000; }
  .choice.danger { color: #d8423a; }
  /* 電梯按鈕面板（金屬質感圓形按鈕） */
  /* 控制室的顏色按鈕 */
  .color-wrap { margin: .6em 0 1em; animation: fadein .4s ease-out both; cursor: default; }
  .color-pad { display: inline-grid; grid-template-columns: repeat(5, 46px); gap: 12px; padding: 18px 20px; margin-bottom: 10px;
    background: linear-gradient(135deg, #3a3f42, #5b6164 40%, #33383b); border: 1px solid #222; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 18px rgba(0,0,0,.6); }
  .color-btn { width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 3px solid #1a1a1a; background: var(--c); cursor: pointer;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.28), inset 0 3px 0 rgba(255,255,255,.35), 0 4px 0 #111; transition: transform .08s, box-shadow .08s; }
  .color-btn[aria-pressed="true"] { transform: translateY(3px); border-color: #fff; box-shadow: inset 0 4px 6px rgba(0,0,0,.4), 0 1px 0 #111, 0 0 10px rgba(255,255,255,.55); }
  .color-btn:focus-visible { outline: 2px solid #ffd76a; outline-offset: 3px; }
  .color-wrap.done .color-btn { cursor: default; }
  .color-wrap .choice { display: block; }
  .stage p.color-msg { margin: .4em 0 0; color: #bbb; animation: fadein .3s ease-out both; }
  @media (max-width: 420px) { .color-pad { grid-template-columns: repeat(5, 40px); gap: 9px; padding: 14px; } .color-btn { width: 40px; height: 40px; } }
  .lift-pad { display: inline-flex; flex-direction: column; align-items: center; gap: 14px; margin: .6em 0 1em; padding: 18px 22px 20px;
    background: linear-gradient(135deg, #8d9396, #c9cdcf 22%, #7c8285 48%, #b9bec0 72%, #6f7578);
    border: 1px solid #4b5053; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(0,0,0,.6);
    animation: fadein .4s ease-out both; cursor: default; }
  .lift-screen { width: 196px; height: 30px; overflow: hidden; white-space: nowrap; text-align: right; padding: 0 8px; box-sizing: border-box;
    background: #120604; border: 2px inset #555; border-radius: 3px; color: #ff4a2a; font: 700 17px/26px "Courier New", monospace; letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(255,80,40,.8); }
  .lift-cols { display: flex; gap: 22px; }
  .lift-col { display: flex; flex-direction: column; gap: 10px; }
  .lift-ctl { display: flex; gap: 22px; }
  .lift-btn { width: 46px; height: 46px; border-radius: 50%; padding: 0; cursor: pointer;
    font: 700 17px/1 "Noto Sans TC", sans-serif; color: #2b2f31; text-shadow: 0 1px 0 rgba(255,255,255,.6);
    background: radial-gradient(circle at 35% 30%, #ffffff, #d7dbdd 30%, #9aa0a3 70%, #6d7376);
    border: 2px solid #5d6366; box-shadow: inset 0 -2px 3px rgba(0,0,0,.35), inset 0 2px 2px rgba(255,255,255,.7), 0 2px 3px rgba(0,0,0,.5);
    transition: box-shadow .15s, color .15s; }
  .lift-btn.word { font-size: 13px; }
  .lift-btn:hover, .lift-btn:focus-visible { outline: none; color: #000; box-shadow: inset 0 -2px 3px rgba(0,0,0,.35), inset 0 2px 2px rgba(255,255,255,.7), 0 0 0 2px var(--line-green); }
  .lift-btn:active, .lift-btn.lit { color: #ff8a1a; text-shadow: 0 0 6px rgba(255,150,40,.9); box-shadow: inset 0 2px 4px rgba(0,0,0,.45), 0 0 8px rgba(255,150,40,.7); }
  .lift-pad.done .lift-btn { cursor: default; }
  .stage p.lift-msg { animation: fadein .4s ease-out both; }
  .stage-wrap.lift-shake { animation: liftshake .14s linear infinite; }
  @keyframes liftshake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-1.5px,1px); } 50% { transform: translate(1px,-1px); } 75% { transform: translate(1.5px,1px); } }
  @media (prefers-reduced-motion: reduce) { .stage-wrap.lift-shake { animation: none; } }
  .choice.danger:hover, .choice.danger:focus-visible { color: #ff5a4f; }
  /* QR 碼網頁視窗 */
  .qr-win {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 2vh 2vw; background: rgba(0,0,0,.7);
    animation: fadein .2s ease-out both;
  }
  .qr-frame-wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #000; border: 2px solid #3a4441;
    box-shadow: 0 0 40px rgba(0,0,0,.8);
  }
  /* CRT 螢幕效果：只疊在網頁內容上（不含上方工具列），不影響點擊 */
  .crt-screen { position: relative; flex: 1; min-height: 0; display: flex; }
  .crt-screen::before,
  .crt-screen::after {

<!-- 隧道逃生小遊戲 -->

</div>

<div class="modal" id="modal" hidden role="alertdialog" aria-live="assertive">

    oldManFlee: "能逃去哪裡？！",
    omen: "一陣惡寒",
    recall: "牆上的海報",
    afterQR: "存在手機裡的網站",
    noOneBoards: "車廂裡的演講",
    askOldMan: "老人要錢",
    giveMore: "還有四十塊",
    closeLook: "口袋裡的兩百塊",
    toilet: "廁所門口的字條",
    womensRoom: "今天是什麼日子？",
    explore: "開始探索",
    liftFloor: "陌生的長廊",
    explorePlatform: "命運的抉擇",   // 對向月台（訂過內臟之水後）的【喝】【不喝】
    bones: "隧道的盡頭"
  };
  // 需要特定條件才會出現分歧的頁面（觸發過才列入）
  const JUMP_EXTRA = {
    "run@7": {
      after: "run",
      label: "無論如何都到不了",
      choices: ["停下來"],
      go: () => { runCount = 6; goScene("run"); },  // 進入時會 +1，剛好是第七次
      show: () => paidOldMan
    }
  };
  const choicesOf = (sc) => typeof sc.choices === "function" ? sc.choices() : sc.choices;
  // 【繼續跑】那一頁另外處理（見 JUMP_EXTRA）
  // 跳轉劇情列表的順序（依故事路線）。「run」那一列是第七次的【停下來】【打電話求救】
  const JUMP_ORDER = [
    "lobby", "omen", "afterQR",             // 進站
    "toilet", "womensRoom",                 // 廁所
    "xindian",                              // 往新店的月台
    "loop", "keepGoing", "run",             // 重走一次 → 繼續走 → 無限下樓
    "talk", "lookClose", "oldManFlee",      // 跟人搭話 → 老人 → 隧道裡的東西
    "askOldMan",                            // 老人要錢
    "stopThink", "onTrain", "backAgain",    // 停下來思考 → 上車
    "closeLook",                            // 半截的男生
    "noOneBoards",                          // 為什麼沒有人上車？
    "explore", "liftFloor",                 // 開始探索 → 電梯裡的長廊
    "bones"                                 // 地下十八樓：白骨與防洪門
  ];
  const isBranch = (sc) => !sc.noJump && !sc.ending && sc !== scenes.run && (choicesOf(sc) || []).length >= 2;

  // 一行可以是字串、{ text, cls }，或 { segs: [[文字, class], ...] }（行內部分文字加特效）
  const segsOf = (item) => typeof item === "string" ? [[item]] : typeof item === "function" ? [[item()]] : item.segs || [[item.text]];
  const lenOf = (item) => segsOf(item).reduce((n, sg) => n + sg[0].length, 0);
  function renderLine(item, n) {
    currentP.textContent = "";
    let left = n;
    for (const [t, cls] of segsOf(item)) {
      if (left <= 0) break;
      const part = t.slice(0, left);
      left -= part.length;
      if (cls) {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = part;
        currentP.appendChild(span);
      } else {
        currentP.appendChild(document.createTextNode(part));
      }
    }
    currentP.appendChild(caret);
  }

  const SPEED = 28; // 毫秒 / 字

  const $ = (id) => document.getElementById(id);
  const screens = { title: $("title-screen"), story: $("story-screen"), endings: $("endings-screen") };
  const stage = $("stage");

  let scene = null, lineIndex = 0, charIndex = 0, timer = null;
  let typing = false, waitingChoice = false, currentP = null;
  const caret = document.createElement("span");
  caret.className = "caret";

  function show(name) {
    if (name === "title") applyTitleState();
    Object.entries(screens).forEach(([k, el]) => el.hidden = k !== name);
    currentScreen = name;
    saveProgress();
  }

  // ---------- 重新整理後停在同一頁 ----------
  const PROGRESS_KEY = "sjnj-progress";
  let currentScreen = "title", sceneId = null;
  function saveProgress() {
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({ screen: currentScreen, scene: sceneId, runCount }));
    } catch (e) {}
  }
  function restoreProgress() {
    let p = null;
    try { p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null"); } catch (e) {}
    if (!p) return;
    if (p.scene === "dreamStay") { show("title"); return; }   // 留在夢裡：重新整理就回首頁
    if (p.screen === "story" && p.scene && scenes[p.scene]) {
      runCount = p.runCount || 0;
      show("story");
      goScene(p.scene, { restore: true });   // 從這一頁的開頭重新讀
    } else if (p.screen === "endings") {
      renderEndings();
      show("endings");
    }
  }

  // 觸發「歡迎來到松江南京站」後，首頁變成扭曲的樣子
  // 記住首頁原本的樣子，清除記錄時還原
  const titleOriginal = {
    h1: document.querySelector("#title-screen h1").innerHTML,
    intro: document.querySelector("#title-screen .intro").innerHTML,
    start: $("btn-start").textContent
  };
  function resetTitle() {
    screens.title.style.background = "";
    document.querySelector("#title-screen h1").innerHTML = titleOriginal.h1;
    const intro = document.querySelector("#title-screen .intro");
    intro.classList.remove("broken");
    intro.innerHTML = titleOriginal.intro;
    $("btn-start").textContent = titleOriginal.start;
  }

  // 達成過「歡迎來到松江南京站」結局：出現「其他作品」「贊助我們」
  function applyTitleLinks() {
    $("extra-links").hidden = !unlocked.has("welcome");
  }
  // 兩個 GOOD END（她的名字、執念）都達成：首頁變回原本的樣子；
  //「開始遊戲」會發光，之後按下去都會進入 TRUE END
  const trueOpen = () => unlocked.has("her") && unlocked.has("obsession") && !truePaused;
  const trueNext = trueOpen;
  function applyTitleState() {
    applyTitleLinks();
    $("btn-start").classList.toggle("glow", trueNext());
    if (trueOpen()) { resetTitle(); return; }
    if (!welcomeReached) return;
    screens.title.style.background =
      'url("https://images.plurk.com/243lWGITn9lgeKFSBJrfaE.png") center / cover no-repeat, #0b0e0d';
    document.querySelector("#title-screen h1").innerHTML = '木公氵工南京立占<span class="comma">，</span>至刂了';
    const intro = document.querySelector("#title-screen .intro");
    intro.classList.add("broken");
    intro.textContent = "已經不 能回■了。\n辶言衤里不是亻尒 言亥? 白勺 土也 方。\n本故事不ˊ是真實的，不 是真 ?的。";
    $("btn-start").textContent = "開?遊ァ戲?";
  }

  // 電梯門（0 = 全開）
  const stageWrap = document.querySelector(".stage-wrap");
  // 手電筒跟著游標（觸控時跟著手指）
  // 手機：手指按下或拖曳時光圈跟著移動（手電筒期間畫面不捲動，見 CSS 的 touch-action）
  const moveTorch = (ev) => {
    if (!stageWrap.classList.contains("flashlight")) return;
    const r = stageWrap.getBoundingClientRect();
    stageWrap.style.setProperty("--fx", (ev.clientX - r.left) + "px");
    stageWrap.style.setProperty("--fy", (ev.clientY - r.top) + "px");
  };
  document.addEventListener("pointermove", moveTorch);
  document.addEventListener("pointerdown", moveTorch);
  // 讓玩家把檔案存到電腦
  function downloadB64({ b64, url: fileUrl, name, type }) {
    if (fileUrl) {   // 發布版：檔案放在網站資料夾裡，直接下載
      const a = document.createElement("a");
      a.href = fileUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    const url = URL.createObjectURL(new Blob([arr], { type: type || "application/octet-stream" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  // anim：開門時保留門板，等滑開的動畫跑完才收起來
  let doorTimer = 0;
  function setDoor(v, anim) {
    clearTimeout(doorTimer);
    const on = stageWrap.classList.contains("doors");
    if (v > 0 && !on) {
      // 門板原本是隱藏的：先以寬度 0 出現，下一步再關上，才會有關門動畫
      stageWrap.style.setProperty("--door", "0");
      stageWrap.classList.add("doors");
      void stageWrap.offsetWidth;
    }
    if (v === 0 && anim && on) {
      stageWrap.style.setProperty("--door", "0");
      doorTimer = setTimeout(() => stageWrap.classList.remove("doors"), 950);
      return;
    }
    stageWrap.classList.toggle("doors", v > 0);
    stageWrap.style.setProperty("--door", String(v));
  }

  // 劇情頁可用的背景特效（scene.bg）
  const SCENE_BGS = ["blood", "fall", "dream", "white"];
  function goScene(id, opts = {}) {
    clearTimeout(timer);
    seaReplay = false;
    stageWrap.classList.remove("lift-shake");
    screens.story.classList.remove("glitch", "glitch-soft");
    if (opts.doorOpen) {
      // 電梯門先保持關著，下一格畫面再打開（才會有開門的動畫）
      setDoor(0.5);
      requestAnimationFrame(() => requestAnimationFrame(() => setDoor(0, true)));
    } else setDoor(0);
    if (id === "@title") { try { if (/[?&]page=/.test(location.search)) history.replaceState(null, "", location.pathname); } catch (e) {} SCENE_BGS.forEach((c) => screens.story.classList.remove(c)); stageWrap.classList.remove("flashlight"); bgm.muted = false; show("title"); return; }
    if (id === "trueEnd") { trueNewsOpens = 0; trueSecret = !!opts.secret; newsGirlsRed = false; }   // 每次進 TRUE END 重新計算
    // 流量統計：進入 TRUE END 那一頁時，網址暫時變成 ?page=true-end，Cloudflare 會把它算成一次獨立的瀏覽；離開時改回原本的網址
    try {
      if (id === "trueEnd") { if (!/[?&]page=true-end/.test(location.search)) history.pushState(null, "", location.pathname + "?page=true-end"); }
      else if (/[?&]page=/.test(location.search)) history.replaceState(null, "", location.pathname);
    } catch (e) {}
    scene = scenes[id];
    stageWrap.classList.toggle("flashlight", !!scene.flashlight);
    SCENE_BGS.forEach((c) => screens.story.classList.toggle(c, scene.bg === c));
    bgm.muted = !!scene.flashlight;   // 手電筒那一頁背景音樂靜音
    sceneId = id;
    if (id === "giveTen" && !visited.has("giveTen")) notifyUnlock("軌道");   // 給過老人四十塊：【？？】變成【軌道】
    markVisited(id);
    if (scene.onEnter && !opts.restore) scene.onEnter();
    saveProgress();
    if (scene.ending) unlockEnding(scene.ending, opts.restore);
    stage.innerHTML = "";
    stage.scrollTop = 0;
    lineIndex = 0;
    currentP = null;
    typing = false;
    waitingChoice = false;
    pendingEnd = null;
    answering = false;
    gateWait = false;
    nextLine();
  }

  function startStory() {
    show("story");
    goScene(trueNext() ? "trueEnd" : "start");
  }

  function scrollDown() { stage.scrollTop = stage.scrollHeight; }

  function nextLine() {
    if (waitingChoice || gateWait) return;
    if (lineIndex >= scene.lines.length) { showChoices(); return; }
    if (currentP) currentP.classList.add("old");
    const item = scene.lines[lineIndex];
    if (item && item.door != null) setDoor(item.door);
    if (item && item.unlock) unlockEnding(item.unlock);

    // 控制室的顏色按鈕：答對才繼續往下
    if (item.colorPad) {
      caret.remove();
      const cur = scene;
      gateWait = true;
      stage.appendChild(buildColorPad(() => { if (scene === cur && gateWait) { gateWait = false; nextLine(); } }));
      currentP = null;
      lineIndex++;
      scrollDown();
      return;
    }

    // 頁面中間的按鈕：按了才繼續往下（按鈕留著可以重複按）
    if (item.gate) {
      caret.remove();
      const box = document.createElement("div");
      box.className = "choices";
      const b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.textContent = `【${item.gate}】`;
      const cur = scene;
      gateWait = true;
      const release = () => { if (scene === cur && gateWait) { gateWait = false; nextLine(); } };
      b.addEventListener("click", (ev) => { ev.stopPropagation(); item.action(release); });
      box.appendChild(b);
      stage.appendChild(box);
      currentP = null;
      lineIndex++;
      scrollDown();
      return;
    }

    if (item.video) {
      caret.remove();
      const fig = document.createElement("figure");
      fig.className = "scene-video";
      const v = document.createElement("video");
      v.src = (safeMode && item.safe) ? item.safe : item.video;
      v.playsInline = true;
      v.preload = "auto";
      v.addEventListener("loadeddata", scrollDown);
      // 關掉瀏覽器自帶的子母畫面、投放等按鈕
      v.disablePictureInPicture = true;
      v.disableRemotePlayback = true;
      v.setAttribute("disablepictureinpicture", "");
      v.setAttribute("disableremoteplayback", "");
      v.setAttribute("controlslist", "nodownload nofullscreen noplaybackrate noremoteplayback");
      v.addEventListener("contextmenu", (ev) => ev.preventDefault());
      fig.appendChild(v);
      // 透明遮罩蓋在影片上：滑鼠碰不到影片，瀏覽器就不會跳出懸浮按鈕（例如 Edge 的影片加強）
      const shield = document.createElement("div");
      shield.className = "video-shield";
      fig.appendChild(shield);
      // 自動播放；若瀏覽器擋下有聲播放，改為靜音播放並顯示控制列讓玩家開聲音（此時拿掉遮罩）
      v.play().catch(() => { v.muted = true; v.controls = true; shield.remove(); v.play().catch(() => {}); });
      stage.appendChild(fig);
      currentP = null;
      lineIndex++;
      scrollDown();
      if (lineIndex >= scene.lines.length) showChoices();
      return;
    }

    // 點一下畫面：把上一張圖換成另一張
    if (item.swapImg) {
      const imgs = stage.querySelectorAll("figure.scene-img img");
      const last = imgs[imgs.length - 1];
      if (last) last.src = (safeMode && item.safe) ? item.safe : item.swapImg;
      currentP = null;
      lineIndex++;
      if (lineIndex >= scene.lines.length) showChoices();   // 這一下只換圖，下一下才出現下一行
      return;
    }

    if (item.img) {
      caret.remove();
      const fig = document.createElement("figure");
      fig.className = "scene-img";
      const img = new Image();
      img.src = (safeMode && item.safe) ? item.safe : item.img;
      img.alt = "";
      if (!item.noScroll) img.addEventListener("load", scrollDown);   // noScroll：圖片出現時不自動往下捲
      if (item.download) {
        img.classList.add("dl-img");
        img.title = "點擊下載";
        img.addEventListener("click", (ev) => { ev.stopPropagation(); downloadB64(item.download); });
      }
      fig.appendChild(img);
      if (item.download) {
        const cap = document.createElement("figcaption");
        cap.className = "dl-cap";
        cap.textContent = "點擊圖片可下載";
        fig.appendChild(cap);
      }
      stage.appendChild(fig);
      currentP = null;
      lineIndex++;
      if (!item.noScroll) scrollDown();
      if (lineIndex >= scene.lines.length) showChoices();
      return;
    }

    currentP = document.createElement("p");
    if (item.cls) currentP.className = item.cls;
    stage.appendChild(currentP);
    charIndex = 0;
    typing = true;
    typeChar();
  }

  function typeChar() {
    const item = scene.lines[lineIndex];
    charIndex++;
    renderLine(item, charIndex);
    scrollDown();
    if (charIndex < lenOf(item)) timer = setTimeout(typeChar, item.speed || SPEED);
    else finishLine();
  }

  function finishLine() {
    clearTimeout(timer);
    renderLine(scene.lines[lineIndex], Infinity);
    typing = false;
    lineIndex++;
    scrollDown();
    if (lineIndex >= scene.lines.length) showChoices();
  }

  function showChoices() {
    waitingChoice = true;
    caret.remove();
    if (scene.dial) { showDial(); return; }
    if (scene.ask) { showAsk(); return; }
    if (scene.liftPad) { showLiftPad(); return; }
    if (scene.afterLines && scene.afterLines()) return;
    if (scene.endOnClick) { pendingEnd = scene.endOnClick; return; }
    // 選項照常顯示，但再點一下畫面就前往指定頁面
    if (scene.thenClick) { const t = scene.thenClick(); if (t) pendingEnd = () => goScene(t); }
    const list = typeof scene.choices === "function" ? scene.choices() : scene.choices;
    if (scene === scenes.run && list.length >= 2) markVisited("run@7");
    if (!list.length) return;
    const box = document.createElement("div");
    box.className = "choices";
    list.forEach((c) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      if (c.cls) b.classList.add(c.cls);
      b.textContent = `【${c.text}】`;
      b.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (c.blocked) showModal(c.blocked);
        else if (c.action) c.action();
        else goScene(c.to);
      });
      box.appendChild(b);
    });
    stage.appendChild(box);
    scrollDown();
  }

  // 文字回答（例如女廁的問題）
  function startAnswer(a) {
    answering = true;
    const box = stage.querySelector(".choices");
    if (box) box.remove();
    showAsk(a);
  }

  function showAsk(a = scene.ask) {
    const form = document.createElement("form");
    form.className = "dial";
    form.innerHTML = '<input id="ask-input" type="text" autocomplete="off">' +
      '<button class="choice" type="submit"></button>';
    const input = form.querySelector("input");
    input.placeholder = a.placeholder || "";
    input.setAttribute("aria-label", a.label || "回答");
    form.querySelector("button").textContent = `【${a.button || "確認"}】`;
    form.addEventListener("click", (ev) => ev.stopPropagation());
    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      const to = a.answer(v);
      if (!to) { input.value = ""; input.focus(); return; }   // 沒有對應的頁面：清空重打
      goScene(to);
    });
    stage.appendChild(form);
    scrollDown();
    input.focus({ preventScroll: true });
  }

  // 控制室的十個顏色按鈕（點一下按下、再點一下彈起）；正確答案是義津川著作封面的五個顏色
  const COLOR_BTNS = [
    { name: "紅色", c: "#d32f2f" },
    { name: "深藍色", c: "#1f2f6b", ok: true },
    { name: "檸檬黃", c: "#f2d024" },
    { name: "薰衣草紫", c: "#b39ddb", ok: true },
    { name: "橘色", c: "#f57c00" },
    { name: "粉紅色", c: "#f48fb1", ok: true },
    { name: "天藍色", c: "#4fc3f7" },
    { name: "乳白色", c: "#f5f0e1", ok: true },
    { name: "咖啡色", c: "#6d4c41" },
    { name: "深綠色", c: "#1e5631", ok: true }
  ];
  function buildColorPad(onSolved) {
    const wrap = document.createElement("div");
    wrap.className = "color-wrap";
    wrap.addEventListener("click", (ev) => ev.stopPropagation());
    const pad = document.createElement("div");
    pad.className = "color-pad";
    const btns = COLOR_BTNS.map((d) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "color-btn";
      b.style.setProperty("--c", d.c);
      b.setAttribute("aria-label", d.name);
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (wrap.classList.contains("done")) return;
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      pad.appendChild(b);
      return b;
    });
    wrap.appendChild(pad);
    const ok = document.createElement("button");
    ok.type = "button"; ok.className = "choice"; ok.textContent = "【確定】";
    let msg = null;
    ok.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (wrap.classList.contains("done")) return;
      const right = btns.every((b, i) => (b.getAttribute("aria-pressed") === "true") === !!COLOR_BTNS[i].ok);
      if (msg) { msg.remove(); msg = null; }
      if (right) {
        wrap.classList.add("done");
        ok.remove();
        setAdultMember(true);
        onSolved();
        return;
      }
      // 按錯：同一頁顯示「沒有反應……」，按鈕全部彈起
      btns.forEach((b) => b.setAttribute("aria-pressed", "false"));
      msg = document.createElement("p");
      msg.className = "color-msg";
      msg.textContent = "沒有反應……";
      wrap.appendChild(msg);
      scrollDown();
    });
    wrap.appendChild(ok);
    return wrap;
  }

  // 電梯按鈕面板：0～4、5～9 各一直排，下方是確認、取消
  // 輸入的樓層 → 抵達的場景
  // B18：沒有拿到【平安符】的話會到 BAD END：不被庇佑的人
  const LIFT_FLOORS = { "2503071213159": "liftFloor", get B18() { return hasAmulet ? "underpass" : "endUnblessed"; } };
  function showLiftPad() {
    const pad = document.createElement("div");
    pad.className = "lift-pad";
    pad.addEventListener("click", (ev) => ev.stopPropagation());
    const screen = document.createElement("div");
    screen.className = "lift-screen";
    screen.setAttribute("aria-live", "polite");

  function triggerCheat() {
    if (cheating) return;

    const W = innerWidth, H = innerHeight;
    const cx = W * 0.5, cy = H * 0.45;
    const wrap = document.createElement("div");

    // 以撞擊點為中心切出放射狀的碎片

    const R = Math.hypot(W, H);
    const angs = Array.from({ length: rays }, (_, i) => (i / rays) * Math.PI * 2 + (Math.random() - .5) * 0.35);
    const pt = (ri, ai) => {
      const r = rings[ri] * R * (ri === 0 ? 0 : (0.85 + Math.random() * 0.3));
      return [cx + Math.cos(angs[ai % rays]) * r, cy + Math.sin(angs[ai % rays]) * r];
    };
    const grid = rings.map((_, ri) => angs.map((_, ai) => pt(ri, ai)));
    const shards = [];
    for (let ri = 0; ri < rings.length - 1; ri++) {
      for (let ai = 0; ai < rays; ai++) {
        const a = grid[ri][ai], b = grid[ri][(ai + 1) % rays], c = grid[ri + 1][(ai + 1) % rays], d = grid[ri + 1][ai];
        const poly = (ri === 0 ? [a, c, d] : [a, b, c, d]).map(([x, y]) => `${x}px ${y}px`).join(",");
        const sh = document.createElement("div");
        sh.className = "shard";
        sh.style.clipPath = `polygon(${poly})`;
        const clone = screens.title.cloneNode(true);
        clone.removeAttribute("id");
        clone.classList.add("title-clone");
        clone.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
        clone.style.position = "absolute"; clone.style.inset = "0";

        clone.style.background = screens.title.style.background || getComputedStyle(screens.title).background;
        sh.appendChild(clone);
        wrap.appendChild(sh);
        const mx = (a[0] + c[0]) / 2 - cx, my = (a[1] + c[1]) / 2 - cy;
        shards.push({ el: sh, mx, my, ri });
      }
    }
    // 裂痕
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "crack");
    let d = "";
    for (let ai = 0; ai < rays; ai++) d += `M${cx},${cy} ` + [1, 2, 3].map((ri) => `L${grid[ri][ai][0]},${grid[ri][ai][1]}`).join(" ") + " ";
    for (let ri = 1; ri < 3; ri++) d += "M" + grid[ri].map(([x, y]) => `${x},${y}`).join(" L") + " Z ";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.appendChild(path);
    wrap.appendChild(svg);
    document.body.appendChild(wrap);
    screens.title.style.visibility = "hidden";

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(() => {
      svg.remove();
      shards.forEach(({ el, mx, my, ri }) => {
        const dist = Math.hypot(mx, my) || 1;
        const tx = (mx / dist) * (120 + Math.random() * 260), ty = (my / dist) * (80 + Math.random() * 200) + 500 + Math.random() * 400;
        const rot = (Math.random() - .5) * 120;
        el.animate([
          { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) rotate(${rot}deg)`, opacity: 0 }

  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => screens.story.addEventListener(t, stopHold));
  window.addEventListener("blur", stopHold);
  screens.story.addEventListener("contextmenu", (ev) => { if (held || holdTimer) ev.preventDefault(); });
  screens.story.addEventListener("click", (ev) => {
    if (held) { held = false; return; }   // 長按放開時的那一下不算點擊
    if (ev.target.closest(".back, .vol, .choice, .dial")) return;
    advance();
  });
  document.addEventListener("keydown", (ev) => {
    if (!call.hidden) return;   // 來電畫面時用按鈕操作
    if (!tunnelWin.hidden) return;   // 小遊戲進行中
    if (!skipTunnel.hidden) return;
    if (!modal.hidden) { ev.preventDefault(); hideModal(); return; }
    if (!qrWin.hidden) { if (ev.key === "Escape") closeQR(); return; }
    if (!jump.hidden) { if (ev.key === "Escape") jump.hidden = true; return; }
    if (screens.story.hidden || ev.target.closest && ev.target.closest(".vol, .back, .choice, .dial")) return;
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); advance(); }
  });
  applyTitleState();
  restoreProgress();
  // 重新整理前留下的通知
  try {
    const pend = JSON.parse(localStorage.getItem(TOAST_KEY) || "[]");
    localStorage.removeItem(TOAST_KEY);
    if (pend.length) setTimeout(() => notifyUnlock(pend.map((m) => m.replace(/^【|】已解放。$/g, ""))), 600);
  } catch (e) {}
})();
</script>
