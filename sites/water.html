<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>百毒不侵！神奇的內臟之水！</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle at center, #ff0000 0%, #ff8c00 16%, #ffee00 32%, #00c800 48%, #0080ff 64%, #4b0082 80%, #9400d3 100%) fixed; font-family: "新細明體", PMingLiU, MingLiU, serif; }
  .bg { position: fixed; inset: 0; background: url("https://images.plurk.com/7h9YVm0IKGpNrpAJWRuYXX.png") center / 800px 600px no-repeat; pointer-events: none; }
  .wrap { position: relative; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; color: #fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  h1 { margin: 0 0 24px; font-size: 40px; font-weight: 900; font-style: italic; letter-spacing: 2px; padding: 0 6px;
    background: linear-gradient(180deg, #ff1a1a 15%, #ffe600 85%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(2px 2px 0 #000); }
  p { margin: 0 0 12px; font-size: 20px; line-height: 1.8; }
  p b { font-weight: 900; }
  .buy { margin-top: 18px; padding: 10px 36px; background: #e00000; color: #fff; font-weight: bold; font-size: 22px; font-family: inherit; border: 3px outset #ff8080; border-radius: 0; cursor: pointer; text-shadow: 1px 1px 0 #000; }
  .buy:hover { background: #ff2a2a; }
  .buy:active { border-style: inset; }
  @media (max-width: 820px) { h1 { font-size: 28px; } p { font-size: 16px; } }
  /* Windows XP 風格彈窗與按鈕 */
  .xp-btn {
    font-family: Tahoma, "新細明體", PMingLiU, sans-serif; font-size: 12px; color: #000;
    padding: 3px 14px; min-width: 75px; cursor: pointer;
    background: linear-gradient(#fff, #ece9d8 85%, #d6d0c0);
    border: 1px solid #003c74; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #fff;
  }
  .xp-btn:hover { box-shadow: inset 0 0 0 2px #f8b636; }
  .xp-btn:active { background: linear-gradient(#e5e3d8, #f3f2ec); }
  .xp-mask { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.15); }
  .xp-win { min-width: 300px; max-width: 420px; background: #ece9d8; border: 1px solid #0831d9; border-radius: 8px 8px 0 0; box-shadow: 2px 3px 10px rgba(0,0,0,.45); font-family: Tahoma, "新細明體", PMingLiU, sans-serif; overflow: hidden; }
  .xp-title { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 4px 8px; color: #fff; font-weight: bold; font-size: 13px; text-shadow: 1px 1px #0a1e6e;
    background: linear-gradient(#0997ff, #0053ee 8%, #0050ee 40%, #06f 88%, #06f 93%, #005bff 95%, #003dd7 96%, #003dd7); }
  .xp-x { width: 21px; height: 21px; border: 1px solid #fff; border-radius: 3px; background: linear-gradient(#e97a5a, #c83a14); color: #fff; font-weight: bold; font-size: 13px; line-height: 17px; text-align: center; cursor: pointer; padding: 0; }
  .xp-body { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 8px; font-size: 13px; line-height: 1.7; color: #000; }
  .xp-icon { flex: none; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8ec5ff, #1c5fd1 70%); color: #fff; font: bold 20px/32px Georgia, serif; text-align: center; }
  .xp-foot { text-align: center; padding: 8px 0 14px; }
  .xp-icon.xp-err { background: radial-gradient(circle at 35% 30%, #ff9a8a, #d0200f 70%); font-family: Tahoma, sans-serif; }
  .xp-input { display: block; width: 220px; margin-top: 6px; font-size: 12px; padding: 2px 3px; border: 1px solid #7f9db9; }
  .xp-wrong { color: #c00; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <h1>百毒不侵！神奇的內臟之水！</h1>
  <p>義津川先生耗費十年研究的生命之水！</p>
  <p>喝下便能保證六個月～一年，不受任何疾病的侵擾！</p>
  <p>此外，用來洗頭、洗澡也是相當棒的選擇。</p>
  <p>一瓶300ml，<b>高級會員</b>限定！購買前須提供會員證號碼。</p>
  <button class="buy" type="button" onclick="waterBuy()">立即購買</button>
</div>
<script>
function xpAlert(html, title) {
  var m = document.createElement('div'); m.className = 'xp-mask';
  m.innerHTML = '<div class="xp-win" role="alertdialog"><div class="xp-title"><span>' + (title || '訊息') + '</span><button class="xp-x" type="button" aria-label="關閉">×</button></div>' +
    '<div class="xp-body"><div class="xp-icon">i</div><div>' + html + '</div></div>' +
    '<div class="xp-foot"><button class="xp-btn" type="button">確定</button></div></div>';
  var close = function () { m.remove(); };
  m.querySelector('.xp-x').onclick = close; m.querySelector('.xp-foot .xp-btn').onclick = close;
  document.body.appendChild(m); m.querySelector('.xp-foot .xp-btn').focus();
}
// 需要檢閱密碼的文章：密碼正確才換頁，錯誤就清空重新輸入
function xpLocked(page, pw) {
  var m = document.createElement('div'); m.className = 'xp-mask';
  m.innerHTML = '<form class="xp-win" role="dialog"><div class="xp-title"><span>錯誤</span><button class="xp-x" type="button" aria-label="關閉">×</button></div>' +
    '<div class="xp-body"><div class="xp-icon xp-err">×</div><div>錯誤！請輸入檢閱密碼：<br><input class="xp-input" type="password" autocomplete="off" aria-label="檢閱密碼"><div class="xp-wrong" hidden>密碼錯誤。</div></div></div>' +
    '<div class="xp-foot"><button class="xp-btn" type="submit">確認</button></div></form>';
  var close = function () { m.remove(); };
  var f = m.querySelector('form'), inp = m.querySelector('.xp-input'), wrong = m.querySelector('.xp-wrong');
  m.querySelector('.xp-x').onclick = close;
  f.onsubmit = function (e) {
    e.preventDefault();
    if (inp.value.replace(/\s/g, '') === pw) {
      close();
      var a = document.createElement('a'); a.href = 'page:' + page; a.hidden = true;
      document.body.appendChild(a); a.click(); a.remove();
    } else { inp.value = ''; wrong.hidden = false; inp.focus(); }
  };
  document.body.appendChild(m); inp.focus();
}
</script>
<script>
// 立即購買：輸入會員證號碼（TW28456）才會訂購成功，錯誤就清空重新輸入
function waterBuy() {
  var m = document.createElement('div'); m.className = 'xp-mask';
  m.innerHTML = '<form class="xp-win" role="dialog"><div class="xp-title"><span>訊息</span><button class="xp-x" type="button" aria-label="關閉">×</button></div>' +
    '<div class="xp-body"><div class="xp-icon">i</div><div>請輸入會員證號碼！<br><input class="xp-input" type="text" autocomplete="off" aria-label="會員證號碼"><div class="xp-wrong" hidden>會員證號碼錯誤。</div></div></div>' +
    '<div class="xp-foot"><button class="xp-btn" type="submit">確認</button></div></form>';
  var close = function () { m.remove(); };
  var f = m.querySelector('form'), inp = m.querySelector('.xp-input'), wrong = m.querySelector('.xp-wrong');
  m.querySelector('.xp-x').onclick = close;
  f.onsubmit = function (e) {
    e.preventDefault();
    if (inp.value.replace(/\s/g, '').toUpperCase() === 'TW28456') { close(); try { parent.__qrWaterOrdered && parent.__qrWaterOrdered(); } catch (e2) {} xpAlert('感謝您的訂購！商品已送至會員的所在地。', '訂購完成'); }
    else { inp.value = ''; wrong.hidden = false; inp.focus(); }
  };
  document.body.appendChild(m); inp.focus();
}
</script>
</body>
</html>
