<body><main id="game" aria-label="隧道逃生，800 × 600 遊戲畫面"><canvas id="scene" aria-label="第一人稱黑暗隧道跑酷遊戲"></canvas>
<div class="hud" id="hud"><div class="progress"><i id="bar"></i></div><div id="hearts" class="hearts" hidden></div><div id="score" class="score" hidden></div><div class="bottom"><span class="kb">← → / A D 移動　・　空白鍵 / ↑ 跳躍　・　↓／S 下滑　・　P 暫停</span><span class="tc">左右滑 換跑道・上滑 跳躍・下滑 滑行</span></div></div>
<div id="hint" class="hint" hidden></div>
<div id="pauseNotice" class="pause-notice" hidden>暫停</div><div id="newRecord" class="new-record" hidden>新紀錄！</div><div class="actions"><button id="quit" class="small" hidden>回首頁</button><button id="pause" class="small">暫停</button></div>
<div class="touch"><div><button id="left" aria-label="向左移動">◀</button><button id="right" aria-label="向右移動">▶</button></div><div><button id="slide" aria-label="蹲下滑行">滑行 ↓</button><button id="jump" aria-label="跳躍">跳躍 ↑</button></div></div>
<div class="overlay" id="overlay"><section class="panel" role="dialog" aria-modal="true" aria-labelledby="title"><div class="eyebrow" id="eyebrow" hidden></div><h1 id="title">它就要追上來了，快逃！</h1><p id="message" hidden></p><div class="guide" id="guide"><div><b>← → ／ A D ／ 左滑、右滑</b>切換跑道</div><div><b>↑ ／ W ／ 空白鍵 ／ 上滑</b>跳躍</div><div><b>↓ ／ S ／ 下滑</b>蹲下滑行</div><div class="warn">撞擊障礙物會導致速度減慢，請務必小心。</div></div><button class="primary" id="start">進入隧道　→</button><button class="primary endless" id="endless" hidden>無盡模式　∞</button><div class="score-line" id="scoreLine" hidden></div><button class="primary again" id="again" hidden>再玩一次　↻</button><div class="arcade-row" id="arcadeRow" hidden><button type="button" id="homeRun">【回首頁】</button><button type="button" id="clearRun">【清除記錄】</button></div><div class="clear-confirm" id="clearConfirm" hidden>要清除跑酷遊戲的紀錄嗎？<button type="button" id="clearYes">【確定】</button><button type="button" id="clearNo">【取消】</button></div></section></div>
<div id="death" class="death" hidden><strong id="deathTitle">BAD END：逃不掉了</strong><div id="deathScore" class="death-score" hidden></div><div class="death-actions"><button id="retry">【重試】</button><button id="giveup">【回首頁】</button></div></div><video id="monsterVideo" muted loop playsinline preload="auto" src="media/tunnel-1.mp4"></video>
<div class="vignette" aria-hidden="true"></div></main>
<audio id="footstepAudio" loop preload="auto" src="media/tunnel-2.mp3"></audio>
<audio id="slideAudio" loop preload="auto" src="media/tunnel-3.mp3"></audio>
<audio id="voiceAudio" preload="auto" src="media/tunnel-4.mp3"></audio>

<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
let W=0,H=0,focal=0,state='ready',elapsed=0,travel=0,lane=0,x=0,height=0,vy=0,objects=[],nextSpawn=.65,last=0,step=0,muted=false,audio=null;
let hits=0,lookTime=0,lookingBack=false,invulnerable=0,resumeState='running',rearView=false,impactShake=0,lowSpawned=0,highSpawned=0,ceilingSpawned=0,crouching=false,crouchUntil=0,crouchBlend=0;
const monster=$('monsterVideo'),matte=document.createElement('canvas');matte.width=512;matte.height=512;const matteCtx=matte.getContext('2d',{willReadFrequently:true});let matteTime=-1;
// 安心開關：怪物換成上下排列（上：畫面、下：透明度）的影片
const SAFE=document.documentElement.dataset.safe==='1';
// 從首頁【跑酷遊戲】開啟：可以選無盡模式，結果不影響劇情
const ARCADE=document.documentElement.dataset.arcade==='1';let endless=false,score=0,scoreTick=0,bestAtStart=0,lastAtStart=null,runSaved=true;
const OB_POINTS={low:10,high:15,ceiling:30};   // 黃色矮欄、紅色障礙、綠色天花板
let stackCtx=null;
if(SAFE){monster.src='media/tunnel-7.mp4';const st=document.createElement('canvas');st.width=512;st.height=1024;stackCtx=st.getContext('2d',{willReadFrequently:true})}
// Six ten-second stages; ease into each new stage over two seconds.
function difficulty(){const stage=Math.min(5,Math.floor(elapsed/10));if(stage===0)return 0;const t=Math.min(1,(elapsed-stage*10)/2);return stage-1+t*t*(3-2*t)}
const speed=()=>14+difficulty()*2;
// Continuous frequency ramp, with a stronger increase in the final half.
const spawnInterval=()=>elapsed<=10?1.65-.91*(elapsed/10):.74-.32*Math.min(1,(elapsed-10)/50);
function resize(){const r=$('game').getBoundingClientRect();W=Math.round(r.width)||800;H=Math.round(r.height)||600;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);focal=W>=H?Math.max(W*.65,H*.75):Math.min(H*.75,W*1.05)}
addEventListener('orientationchange',()=>setTimeout(resize,250));if(window.visualViewport)visualViewport.addEventListener('resize',resize);
addEventListener('resize',resize);resize();
function tone(){}

const footstepAudio=$('footstepAudio'),slideAudio=$('slideAudio');
function syncSlide(){
  const shouldSlide=state==='running'&&!lookingBack&&crouching;
  if(shouldSlide){if(slideAudio.paused)slideAudio.play().catch(()=>{});}
  else if(!slideAudio.paused){slideAudio.pause();}
}
function syncFootsteps(){
  syncSlide();
  const shouldPlay=!muted&&state==='running'&&!lookingBack&&height===0&&vy<=0&&!crouching;
  if(shouldPlay){
    if(footstepAudio.paused){footstepAudio.play().catch(()=>{});}
  }else if(!footstepAudio.paused){footstepAudio.pause();}
}
function modal(title,message,button,eye){$('title').textContent=title;$('message').innerHTML=message;$('start').textContent=button;$('eyebrow').textContent=eye;$('eyebrow').hidden=false;$('message').hidden=false;$('guide').hidden=true;$('overlay').hidden=false;$('start').focus()}
function begin(mode){saveRun();endless=mode===true;score=0;scoreTick=0;runSaved=!endless;voiceStop();bestAtStart=getBest();lastAtStart=getLast();$('newRecord').hidden=true;$('hud').classList.toggle('endless',endless);$('hearts').hidden=!endless;$('score').hidden=!endless;$('deathScore').hidden=true;$('deathTitle').textContent='BAD END：逃不掉了';$('again').hidden=true;state='running';hits=0;lookTime=0;lookingBack=false;invulnerable=0;impactShake=0;$('death').hidden=true;monster.currentTime=0;matteTime=-1;playMonster();elapsed=0;travel=0;lane=0;x=0;height=0;vy=0;objects=[];nextSpawn=.65;step=0;lowSpawned=0;highSpawned=0;ceilingSpawned=0;crouching=false;crouchUntil=0;crouchBlend=0;$('overlay').hidden=true;$('pause').textContent='暫停';footstepAudio.currentTime=0;collisionAudio.pause();collisionAudio.currentTime=0;syncFootsteps();hud()}
function playMonster(){monster.playbackRate=1.5;monster.muted=true;monster.volume=0;monster.play().catch(()=>{})}
function end(win){if(!win)return;state='won';monster.pause();voiceStop();syncFootsteps();tone(680,.7,.1);modal('抵達出口！','拼命奔跑過後，總算是甩掉了「<span style="filter:blur(3px)">那個東西</span>」……<br>在隧道盡頭等著我的，會是什麼呢？',ARCADE?'回首頁':'繼續　→','ESCAPE COMPLETE');$('again').hidden=false;$('hint').textContent=''}
const collisionAudio=$('collisionAudio');
// 撞到障礙物回頭時的聲音：一律從第 2 秒開始播、播完為止、音量漸小；只剩一條命時播完會再從第 2 秒接著播（一直循環）
const voice=$('voiceAudio'),VOICE_START=2;let voiceWasPlaying=false;
const lastLife=()=>hits===2&&(state==='running'||state==='dying'||state==='paused');
function voiceFrom2(){try{voice.currentTime=VOICE_START}catch(_){}voice.play().catch(()=>{})}
function voiceHit(){if(voice.paused||voice.ended)voiceFrom2()}
voice.addEventListener('ended',()=>{if(lastLife()&&state!=='paused')voiceFrom2()});
function voiceUpdate(){voice.loop=false;if(voice.paused)return;if(lastLife())voice.volume=.85;else{const d=(voice.duration||18.6)-VOICE_START;voice.volume=Math.max(0,Math.min(1,.85*(1-Math.max(0,voice.currentTime-VOICE_START)/d)))}}
function voiceStop(){voice.pause();try{voice.currentTime=VOICE_START}catch(_){}}
// 跳躍音效（原音檔只取前 1 秒）
const jumpAudio=$('jumpAudio');function playJumpSound(){jumpAudio.pause();try{jumpAudio.currentTime=0}catch(_){}jumpAudio.play().catch(()=>{})}
function playCollisionSound(){collisionAudio.pause();collisionAudio.currentTime=0;collisionAudio.play().catch(()=>{});}
function collide(o){if(o.hit||invulnerable>0||lookingBack)return;o.hit=true;hits++;playCollisionSound();voiceHit();impactShake=.42;lookingBack=true;lookTime=0;height=0;vy=0;if(hits>=3)state='dying';syncFootsteps();tone(65,.3,.08)}
function pause(){if(state==='running'||state==='dying'){resumeState=state;state='paused';monster.pause();voiceWasPlaying=!voice.paused;voice.pause();$('overlay').hidden=true;$('pauseNotice').hidden=false;$('pause').textContent='繼續';syncFootsteps()}else if(state==='paused'){state=resumeState;playMonster();if(voiceWasPlaying)voice.play().catch(()=>{});$('pauseNotice').hidden=true;$('overlay').hidden=true;$('pause').textContent='暫停';syncFootsteps()}}
function move(d){if(state!=='running'||lookingBack)return;lane=Math.max(-1,Math.min(1,lane+d));tone(150,.06,.02)}
function jump(){if(state==='running'&&!lookingBack&&height===0&&!crouching){vy=7.5;playJumpSound();syncFootsteps();tone(280,.18,.035)}}

{const sb=$('slide');let downAt=0;sb.addEventListener('pointerdown',e=>{e.preventDefault();try{sb.setPointerCapture(e.pointerId)}catch(_){}downAt=performance.now();crouch()});const up=()=>{if(!downAt)return;downAt=0;if(crouching)stand()};for(const t of ['pointerup','pointercancel','lostpointercapture'])sb.addEventListener(t,up)}
